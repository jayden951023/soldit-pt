<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f1620" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>SOLD PT · AI 트레이너</title>
<style>
  :root{
    --bg:#0f1620; --panel:#18222f; --panel2:#1f2c3c; --line:#2a3a4e;
    --ink:#eaf2fb; --sub:#9db1c7; --brand:#2ea8ee; --brand2:#12d18e;
    --warn:#ffb020; --bad:#ff5d6c; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    overscroll-behavior-y:none;}
  body{max-width:520px; margin:0 auto; padding:0 14px calc(96px + env(safe-area-inset-bottom)); min-height:100vh;}
  h1,h2,h3{margin:0}
  button{font-family:inherit; cursor:pointer; border:none; color:inherit}
  .muted{color:var(--sub)}
  .center{text-align:center}
  .hidden{display:none !important}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0}
  .row{display:flex; align-items:center; gap:10px}
  .between{justify-content:space-between}
  .pill{background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--sub)}
  .btn{background:var(--brand); color:#04121e; font-weight:800; border-radius:14px; padding:15px 16px; font-size:16px; width:100%; text-align:center}
  .btn.sec{background:var(--panel2); color:var(--ink); border:1px solid var(--line); font-weight:700}
  .btn.green{background:var(--brand2)}
  .btn.sm{padding:10px 12px; font-size:14px; width:auto}
  .grad{background:linear-gradient(135deg,#2ea8ee,#12d18e); -webkit-background-clip:text; background-clip:text; color:transparent}
  input,select{font-family:inherit; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:12px; padding:13px; font-size:16px; width:100%}
  input[type=number]{-moz-appearance:textfield}
  label.fld{display:block; font-size:13px; color:var(--sub); margin:12px 0 6px}
  /* top */
  header{display:flex; align-items:center; justify-content:space-between; padding:16px 2px 6px}
  .logo{font-weight:900; letter-spacing:-.5px; font-size:20px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  /* nav */
  nav{position:fixed; left:0; right:0; bottom:0; background:rgba(15,22,32,.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); display:flex; max-width:520px; margin:0 auto; padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1; background:none; padding:11px 0 12px; color:var(--sub); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px}
  nav button .ic{font-size:20px; line-height:1}
  nav button.on{color:var(--brand)}
  /* exercise */
  .ex{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin:12px 0; overflow:hidden}
  .ex.done{opacity:.55}
  .ex-h{padding:14px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .ex-h .t{font-weight:800; font-size:17px}
  .ex-h .m{font-size:12px; color:var(--sub); margin-top:3px}
  .yt{background:#ff2d3722; color:#ff8a92; border:1px solid #ff2d3744; border-radius:10px; padding:8px 10px; font-size:12px; font-weight:700; white-space:nowrap}
  .sets{padding:0 12px 12px}
  .set{display:grid; grid-template-columns:34px 1fr 1fr 46px 40px; gap:8px; align-items:center; padding:7px 4px; border-top:1px solid var(--line)}
  .set .lab{font-size:12px; color:var(--sub); text-align:center}
  .set input{padding:10px; text-align:center; font-size:16px}
  .set .chk{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line); font-size:16px; display:flex;align-items:center;justify-content:center}
  .set .chk.on{background:var(--brand2); color:#04121e; border-color:var(--brand2)}
  .rec{font-size:11px;color:var(--brand2); text-align:center}
  .hint{font-size:12px;color:var(--sub); padding:6px 6px 0}
  /* timer */
  .timer{position:fixed; left:0; right:0; bottom:64px; max-width:520px; margin:0 auto; padding:0 14px; z-index:40}
  .timer .inner{background:linear-gradient(135deg,#12d18e,#2ea8ee); color:#04121e; border-radius:16px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; font-weight:800; box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .timer .big{font-size:26px; font-variant-numeric:tabular-nums}
  .timer button{background:rgba(4,18,30,.15); border-radius:10px; padding:8px 12px; font-weight:800}
  /* chat */
  .chat{display:flex; flex-direction:column; gap:10px; padding-bottom:8px}
  .msg{max-width:86%; padding:11px 14px; border-radius:16px; font-size:15px; line-height:1.5; white-space:pre-wrap}
  .msg.a{background:var(--panel); border:1px solid var(--line); border-top-left-radius:4px; align-self:flex-start}
  .msg.u{background:var(--brand); color:#04121e; border-top-right-radius:4px; align-self:flex-end; font-weight:600}
  .chatbar{position:fixed; left:0;right:0; bottom:64px; max-width:520px; margin:0 auto; padding:8px 14px calc(8px + env(safe-area-inset-bottom)); background:rgba(15,22,32,.95); backdrop-filter:blur(8px); border-top:1px solid var(--line); display:flex; gap:8px}
  .chatbar input{flex:1}
  .chatbar button{background:var(--brand); color:#04121e; font-weight:800; border-radius:12px; padding:0 16px}
  /* progress */
  .stat{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .stat .b{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px}
  .stat .b .n{font-size:22px; font-weight:900}
  .stat .b .l{font-size:11px; color:var(--sub)}
  .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2ea8ee,#12d18e)}
  .chip{display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:6px 10px; margin:4px 4px 0 0; font-size:12px}
  .chip b{color:var(--brand2)}
  svg{display:block;width:100%}
  .tag{font-size:11px; font-weight:800; padding:3px 8px; border-radius:6px}
  .tag.push{background:#2ea8ee22;color:#7cc9f5}
  .tag.pull{background:#12d18e22;color:#6fe3b6}
  .tag.legs{background:#ffb02022;color:#ffce6b}
  .tag.upper{background:#a879ff22;color:#c3a0ff}
  .tag.lower{background:#ff7a5922;color:#ffab93}
  .tag.rest{background:#61728822;color:#9db1c7}
  .seg{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px}
  .seg button{flex:1; padding:9px; border-radius:9px; font-size:13px; color:var(--sub); background:none; font-weight:700}
  .seg button.on{background:var(--brand); color:#04121e}
  .note{background:linear-gradient(135deg,#18222f,#1f2c3c); border:1px solid var(--line); border-radius:14px; padding:14px; font-size:14px; line-height:1.6}
  .note .h{font-weight:800; color:var(--brand2); margin-bottom:6px}
  .k{font-size:12px;color:var(--sub)}
  .toast{position:fixed; left:50%; top:20px; transform:translateX(-50%); background:#04121e; border:1px solid var(--brand2); color:var(--brand2); padding:12px 18px; border-radius:12px; font-weight:800; z-index:99; box-shadow:0 8px 30px rgba(0,0,0,.5)}
  /* gamification */
  .game{background:linear-gradient(135deg,#1a2740,#12203a); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0}
  .game .lv{display:flex; align-items:center; gap:12px}
  .ring{position:relative; width:64px; height:64px; flex:0 0 64px}
  .ring .txt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900}
  .ring .txt small{font-size:9px; color:var(--sub); font-weight:700}
  .lvlbadge{font-size:13px; font-weight:900; color:#04121e; background:linear-gradient(135deg,#ffd76b,#ffb020); padding:3px 9px; border-radius:999px}
  .xpbar{height:9px;background:#0d1826;border-radius:99px;overflow:hidden;margin-top:7px;border:1px solid var(--line)}
  .xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#ffd76b,#ffb020)}
  .badges{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
  .bdg{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:9px 4px; text-align:center}
  .bdg.lock{opacity:.32; filter:grayscale(1)}
  .bdg .i{font-size:22px; line-height:1.1}
  .bdg .n{font-size:9.5px; color:var(--sub); margin-top:3px; line-height:1.1}
  .motiv{font-size:13px; color:#ffd76b; font-weight:700; margin-top:10px; line-height:1.5}
  /* celebrate */
  .cele{position:fixed; inset:0; z-index:90; background:rgba(6,12,20,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center; overflow:hidden}
  .cele h1{font-size:30px; margin-bottom:6px}
  .cele .sub{color:var(--sub); margin-bottom:20px}
  .cele .box{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; width:100%; max-width:340px}
  .cele .g2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .cele .g2 .n{font-size:24px; font-weight:900} .cele .g2 .l{font-size:11px; color:var(--sub)}
  .cele .xpg{font-size:16px; font-weight:900; color:#ffd76b; margin-top:14px}
  .cele .newb{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .cele .newb .b{background:linear-gradient(135deg,#ffd76b22,#ffb02022); border:1px solid #ffb02055; border-radius:12px; padding:8px 12px; font-size:13px; font-weight:800; color:#ffd76b}
  .cele .mv{color:#eaf2fb; font-size:15px; font-weight:700; margin:18px 0 22px; line-height:1.6}
  .cf{position:fixed; top:-20px; width:9px; height:14px; z-index:91; border-radius:2px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.9}}
</style>
</head>
<body>

<!-- ===== ONBOARD / PROFILE ===== -->
<div id="onboard" class="hidden">
  <div style="padding:48px 4px 8px">
    <div class="logo grad" style="font-size:34px">SOLD PT</div>
    <p class="muted" style="margin-top:8px">과학 기반 AI 트레이너 · 베타</p>
  </div>
  <div class="card">
    <h3>누구세요?</h3>
    <p class="k" style="margin:6px 0 14px">기록은 사람별로 따로 저장돼요.</p>
    <div id="profileList"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <header>
    <div class="logo grad">SOLD PT</div>
    <div class="row">
      <span id="streakPill" class="pill">🔥 0일</span>
      <button class="avatar" id="whoBtn">나</button>
    </div>
  </header>

  <!-- HOME -->
  <section id="view-home"></section>
  <!-- WORKOUT -->
  <section id="view-workout" class="hidden"></section>
  <!-- CHAT -->
  <section id="view-chat" class="hidden"></section>
  <!-- PROGRESS -->
  <section id="view-progress" class="hidden"></section>
  <!-- SETTINGS -->
  <section id="view-settings" class="hidden"></section>

  <div id="timerWrap" class="timer hidden"></div>

  <nav>
    <button data-nav="home" class="on"><span class="ic">🏠</span>홈</button>
    <button data-nav="workout"><span class="ic">🏋️</span>운동</button>
    <button data-nav="chat"><span class="ic">💬</span>코치</button>
    <button data-nav="progress"><span class="ic">📈</span>기록</button>
    <button data-nav="settings"><span class="ic">⚙️</span>설정</button>
  </nav>
</div>

<script>
/* ============================================================
   SOLD PT — 과학 기반 개인 트레이너 (베타, 클라이언트 전용/localStorage)
   - 무게/횟수/RIR 영구 기록 → 점진적 과부하 자동 반영
   - PPLUL 분할, 오토레귤레이션(컨디션 반영), 6주 디로드
   - 운동방법 → 유튜브, 세트 완료 → 쉬는시간 타이머
   ============================================================ */
"use strict";
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const todayKey = ()=>{const d=new Date(Date.now()+9*3600*1000); return d.toISOString().slice(0,10);};
const nowKST = ()=> new Date(Date.now()+9*3600*1000);
const round = (n,step)=> Math.round(n/step)*step;
const toast = (m)=>{const t=el('div','toast',m); document.body.appendChild(t); setTimeout(()=>t.remove(),1900);};

/* ---------- 운동 DB (근거: 부위 주2회 빈도, 6~15렙 다양화, RIR 관리) ---------- */
// eq: 필요한 기구 태그 / yt: 유튜브 검색어 / type: comp(복합)·iso(고립) / start:초보 시작무게(kg,바벨/머신 총중량 기준)·null이면 맨몸
const EX = {
  bench:       {name:"바벨 벤치프레스", m:"가슴", eq:["바벨","벤치"], type:"comp", rep:[6,10], inc:2.5, start:40, yt:"바벨 벤치프레스 정확한 자세"},
  chestpress:  {name:"체스트프레스 머신", m:"가슴", eq:["체스트프레스머신"], type:"comp", rep:[8,12], inc:2.5, start:25, yt:"체스트프레스 머신 자세"},
  inclinedb:   {name:"인클라인 덤벨프레스", m:"가슴(상부)", eq:["덤벨","인클라인벤치"], type:"comp", rep:[8,12], inc:2, start:12, yt:"인클라인 덤벨프레스 자세"},
  cablefly:    {name:"케이블 플라이", m:"가슴", eq:["케이블"], type:"iso", rep:[12,15], inc:2.5, start:10, yt:"케이블 플라이 자세"},
  ohp:         {name:"바벨 오버헤드프레스", m:"어깨", eq:["바벨"], type:"comp", rep:[6,10], inc:2.5, start:20, yt:"오버헤드프레스 자세"},
  shpress:     {name:"숄더프레스 머신", m:"어깨", eq:["숄더프레스머신"], type:"comp", rep:[8,12], inc:2.5, start:15, yt:"숄더프레스 머신 자세"},
  latraise:    {name:"사이드 레터럴 레이즈", m:"어깨(측면)", eq:["덤벨"], type:"iso", rep:[12,20], inc:1, start:6, yt:"사이드 레터럴 레이즈 자세"},
  facepull:    {name:"페이스풀", m:"어깨(후면)", eq:["케이블"], type:"iso", rep:[15,20], inc:2.5, start:12, yt:"페이스풀 자세"},
  pushdown:    {name:"케이블 삼두 푸시다운", m:"삼두", eq:["케이블"], type:"iso", rep:[10,15], inc:2.5, start:15, yt:"삼두 푸시다운 자세"},
  dips:        {name:"딥스", m:"가슴/삼두", eq:["딥스바"], type:"comp", rep:[6,12], inc:0, start:null, yt:"딥스 정확한 자세"},
  pullup:      {name:"풀업(턱걸이)", m:"등", eq:["풀업바"], type:"comp", rep:[5,10], inc:0, start:null, yt:"풀업 정확한 자세"},
  latpull:     {name:"랫풀다운", m:"등(광배)", eq:["랫풀다운"], type:"comp", rep:[8,12], inc:2.5, start:35, yt:"랫풀다운 자세"},
  barrow:      {name:"바벨 로우", m:"등", eq:["바벨"], type:"comp", rep:[6,10], inc:2.5, start:30, yt:"바벨 로우 자세"},
  seatedrow:   {name:"시티드 케이블 로우", m:"등(중앙)", eq:["시티드로우","케이블"], type:"comp", rep:[8,12], inc:2.5, start:30, yt:"시티드 로우 자세"},
  dbcurl:      {name:"덤벨 컬", m:"이두", eq:["덤벨"], type:"iso", rep:[8,12], inc:2, start:8, yt:"덤벨 컬 자세"},
  hammer:      {name:"해머 컬", m:"이두/전완", eq:["덤벨"], type:"iso", rep:[10,14], inc:2, start:8, yt:"해머 컬 자세"},
  squat:       {name:"바벨 스쿼트", m:"하체 전체", eq:["바벨"], type:"comp", rep:[5,8], inc:5, start:40, yt:"바벨 스쿼트 정확한 자세"},
  hacksquat:   {name:"핵 스쿼트", m:"대퇴사두", eq:["핵스쿼트"], type:"comp", rep:[8,12], inc:5, start:40, yt:"핵 스쿼트 자세"},
  legpress:    {name:"레그프레스", m:"하체 전체", eq:["레그프레스"], type:"comp", rep:[10,15], inc:5, start:60, yt:"레그프레스 자세"},
  rdl:         {name:"루마니안 데드리프트", m:"햄스트링/둔근", eq:["바벨"], type:"comp", rep:[8,12], inc:5, start:40, yt:"루마니안 데드리프트 자세"},
  legcurl:     {name:"레그컬", m:"햄스트링", eq:["레그컬"], type:"iso", rep:[10,15], inc:2.5, start:25, yt:"레그컬 자세"},
  legext:      {name:"레그 익스텐션", m:"대퇴사두", eq:["레그익스텐션"], type:"iso", rep:[12,15], inc:2.5, start:25, yt:"레그 익스텐션 자세"},
  hipthrust:   {name:"힙 쓰러스트", m:"둔근", eq:["바벨","벤치"], type:"comp", rep:[8,12], inc:5, start:40, yt:"힙 쓰러스트 자세"},
  lunge:       {name:"덤벨 런지", m:"하체/둔근", eq:["덤벨"], type:"comp", rep:[10,12], inc:2, start:10, yt:"덤벨 런지 자세"},
  calf:        {name:"카프 레이즈", m:"종아리", eq:["레그프레스"], type:"iso", rep:[12,20], inc:5, start:40, yt:"카프 레이즈 자세"},
  plank:       {name:"플랭크", m:"코어", eq:[], type:"iso", rep:[30,60], inc:0, start:null, yt:"플랭크 정확한 자세"},
  hangleg:     {name:"행잉 레그레이즈", m:"복근", eq:["풀업바"], type:"iso", rep:[10,15], inc:0, start:null, yt:"행잉 레그레이즈 자세"},
};

/* 기본 기구 세트 (일반 헬스장) — 설정에서 수정 가능 */
const DEFAULT_EQUIP = ["바벨","덤벨","벤치","인클라인벤치","케이블","랫풀다운","시티드로우","체스트프레스머신","숄더프레스머신","레그프레스","레그익스텐션","레그컬","핵스쿼트","풀업바","딥스바"];

const weekStart = ()=>{ const d=nowKST(); const day=(d.getDay()+6)%7; const m=new Date(d.getTime()-day*86400000); return m.toISOString().slice(0,10); };
function weekDoneCount(){ const ws=weekStart(); return P().logdays.filter(k=>k>=ws).length; }
function streakCount(){ const days=P().logdays; if(!days.length) return 0; let s=0;
  for(let i=0;i<90;i++){ const t=new Date(nowKST().getTime()-i*86400000); const k=t.toISOString().slice(0,10); const dow=t.getUTCDay();
    if(dow===0||dow===6) continue; if(days.includes(k)) s++; else if(i>0) break; } return s; }
function gameStats(){
  const sessions=P().logdays.length;
  const hist=Object.values(P().history).flat();
  const sets=hist.reduce((a,h)=>a+h.sets.filter(s=>s.w!=null||s.reps!=null).length,0);
  const prs=Object.values(P().history).filter(h=>h.some(x=>x.pr)).length;
  const vol=hist.reduce((a,h)=>a+h.sets.reduce((x,s)=>x+((s.w||0)*(s.reps||0)),0),0);
  const xp=sessions*50+sets*5+prs*30;
  const per=300; const level=Math.floor(xp/per)+1;
  return {sessions,sets,prs,vol,xp,level,xpIn:xp%per,xpFor:per,streak:streakCount(),week:weekDoneCount(),target:P().weeklyTarget||4};
}

/* ---------- 점진적 과부하 엔진 ---------- */
// 지난 기록으로 오늘 추천무게 계산
function recommend(exId){
  const ex = EX[exId]; const hist = (P().history[exId]||[]);
  if(!ex.start && ex.inc===0) return {w:null, reps:ex.rep[1], note:"맨몸 · 반복수 목표"};
  if(hist.length===0) return {w: ex.start, reps: ex.rep[0], note:"첫 세션 · 가벼운 무게로 폼부터"};
  const last = hist[hist.length-1];
  const sets = last.sets.filter(s=>s.w!=null||s.reps!=null);
  if(sets.length===0) return {w:ex.start, reps:ex.rep[0], note:"기록 없음"};
  const w = Math.max(...sets.map(s=>+s.w||0));
  const allTop = sets.every(s=> (+s.reps||0) >= ex.rep[1]);
  const lowRIR = sets.every(s=> (s.rir==null? true : +s.rir<=1));
  const failed = sets.filter(s=> (+s.reps||0) < ex.rep[0]).length;
  if(allTop && lowRIR) return {w: round(w+ex.inc, ex.inc||1.25), reps:ex.rep[0], note:`지난주 목표 달성 → +${ex.inc}kg 🔼`};
  const fails = (P().history[exId]||[]).slice(-2).filter(h=>h.failed).length;
  if(failed>=2 || fails>=2) return {w: round(w*0.9, ex.inc||1.25), reps:ex.rep[0], note:"정체 감지 → 10%↓ 후 재정비"};
  return {w: w, reps: Math.min(ex.rep[1], (Math.max(...sets.map(s=>+s.reps||0))+1)), note:"같은 무게로 반복수 +1 도전"};
}

function estimate1RM(w,reps){ if(!w||!reps) return 0; return Math.round(w*(1+reps/30)); }

/* ---------- 오늘 프로그램 생성 (50분·오토레귤레이션) ---------- */
function todayPlan(){
  const dow = nowKST().getDay();
  const day = SPLIT[dow];
  if(day.key==="rest") return {rest:true, day};
  const eq = P().equip;
  const avail = id => EX[id].eq.every(t=> eq.includes(t) || t==="");
  let pool = day.pool.filter(avail);
  // 부족하면 다른 요일 풀에서 같은 성격 보충
  if(pool.length<5){ for(const k in SPLIT){ for(const id of SPLIT[k].pool){ if(pool.length>=6) break; if(avail(id)&&!pool.includes(id)) pool.push(id);} } }
  // 복합 먼저, 고립 뒤 — 5~6개 (50분)
  const comp = pool.filter(id=>EX[id].type==="comp");
  const iso = pool.filter(id=>EX[id].type==="iso");
  const chosen = [...comp.slice(0,3), ...iso.slice(0,3)].slice(0,6);
  // 오토레귤레이션: 오늘 컨디션
  const r = P().readiness[todayKey()];
  let setMod = 0, wMod = 1, coach="";
  if(r){
    const score = (r.sleep+r.energy+(6-r.soreness)+(6-r.stress))/4; // 1~5
    if(score<=2.3){ setMod=-1; wMod=0.9; coach="컨디션이 낮아 볼륨·강도를 낮췄어요. 오늘은 회복 우선."; }
    else if(score>=4.3){ setMod=+0; wMod=1.03; coach="컨디션 최상! 마지막 세트에서 조금 더 밀어붙여도 좋아요."; }
    else coach="컨디션 양호 — 계획대로 진행합니다.";
  }
  const exs = chosen.map((id,i)=>{
    const ex=EX[id]; const rec=recommend(id);
    let setN = ex.type==="comp"? (i===0?4:3) : 3; setN=Math.max(2,setN+setMod);
    const w = rec.w==null? null : round(rec.w*wMod, ex.inc||1.25);
    return {id, name:ex.name, m:ex.m, type:ex.type, rep:ex.rep, sets:setN, recW:w, recReps:rec.reps, note:rec.note, rest: ex.type==="comp"?90:60, yt:ex.yt};
  });
  const deloadWk = isDeloadWeek();
  if(deloadWk){ exs.forEach(e=>{ e.sets=Math.max(2,e.sets-1); e.recW = e.recW==null?null:round(e.recW*0.9, EX[e.id].inc||1.25); }); }
  return {rest:false, day, exs, coach, deload:deloadWk};
}

// 6주 주기 · 매 6주차 디로드 (첫 기록일 기준)
function isDeloadWeek(){
  const days = P().logdays;
  if(!days.length) return false;
  const first = new Date(days[0]+"T00:00:00");
  const wk = Math.floor((nowKST()-first)/(7*86400000));
  return wk>0 && (wk%6===5);
}

        <button class="chk ${sv.done?'on':''}" data-chk>${sv.done?'✓':''}</button>`;

      chk.onclick=()=>{ const on=!chk.classList.contains("on"); chk.classList.toggle("on",on); chk.textContent=on?'✓':'';
        if(on){ // 빈 값이면 추천치 자동 채움
          const wi=set.querySelector("[data-w]"), ri=set.querySelector("[data-r]");
          if(wi.value===""&&e.recW!=null) wi.value=e.recW; if(ri.value==="") ri.value=e.recReps;
          startTimer(e.rest, e.name);

  const fin=el("button","btn green","✅ 오늘 운동 완료 · 기록 저장"); fin.style.margin="8px 0 4px";
  fin.onclick=finishWorkout; v.appendChild(fin);
  v.appendChild(el("div","hint","각 세트 ✓ 누르면 자동으로 쉬는시간 타이머가 켜지고, 무게/횟수가 저장돼요."));
}

function collectWorkout(){
  const out={sets_by:{}};
  document.querySelectorAll("#view-workout .ex").forEach(card=>{
    const id=card.dataset.ex; const sets=[];
    card.querySelectorAll(".set").forEach((row,idx)=>{
      if(idx===0) return; // header
      const w=row.querySelector("[data-w]"), r=row.querySelector("[data-r]"), rir=row.querySelector("[data-rir]"), chk=row.querySelector("[data-chk]");
      if(!w) return;
      sets.push({w:w.value===""?null:+w.value, reps:r.value===""?null:+r.value, rir:rir.value===""?null:+rir.value, done:chk.classList.contains("on")});
    });
    out.sets_by[id]=sets;
  });
  return out;
}
function saveWorkoutDraft(){
  const c=collectWorkout(); const tk=todayKey();
  P().done[tk]=P().done[tk]||{};
  for(const id in c.sets_by){ P().done[tk][id]={sets:c.sets_by[id]}; }
  persist();
}
function finishWorkout(){
  const c=collectWorkout(); const tk=todayKey(); let newPR=0, logged=0;
  for(const id in c.sets_by){
    const sets=c.sets_by[id].filter(s=> s.w!=null||s.reps!=null);
    if(!sets.length) continue; logged++;
    const ex=EX[id];
    const failed = sets.filter(s=> (s.reps||0) < ex.rep[0]).length>=2;
    // PR 판정 (추정 1RM 최고 갱신)
    const best = Math.max(...sets.map(s=>estimate1RM(s.w,s.reps)));
    const prevBest = Math.max(0,...(P().history[id]||[]).map(h=>h.e1rm||0));
    const pr = best>prevBest && best>0;
    if(pr) newPR++;
    P().history[id]=P().history[id]||[];
    P().history[id].push({date:tk, sets, e1rm:best, failed, pr});
  }
  if(logged===0){ toast("기록할 세트가 없어요"); return; }
  // 오늘 볼륨·세트 집계
  let vol=0, setsCount=0;
  for(const id in c.sets_by){ c.sets_by[id].forEach(s=>{ if(s.w!=null||s.reps!=null){ setsCount++; vol+=(s.w||0)*(s.reps||0);} }); }
  const firstToday = !P().logdays.includes(tk);
  if(firstToday) P().logdays.push(tk);
  P().logdays.sort();
  persist();
  // XP·레벨·배지
  const xpGain = (firstToday?50:0) + setsCount*5 + newPR*30;
  const g=gameStats();
  const levelBefore=Math.floor((g.xp-xpGain)/g.xpFor)+1;
  const levelUp = g.level>levelBefore;
  const newBadges = syncBadges(g);
  persist();
  celebrate({vol, sets:setsCount, xpGain, levelUp, newBadges, newPR:newPR>0});
}

let timerInt=null;
function startTimer(sec, label){
  clearInterval(timerInt);
  const wrap=$("#timerWrap"); wrap.classList.remove("hidden");
  let left=sec||60;
  const draw=()=>{ wrap.innerHTML=`<div class="inner"><div><div style="font-size:12px;opacity:.8">쉬는 시간 · ${label||''}</div>
    <div class="big">${String(Math.floor(left/60)).padStart(1,'0')}:${String(left%60).padStart(2,'0')}</div></div>
    <div class="row"><button onclick="addTimer(15)">+15초</button><button onclick="stopTimer()">건너뛰기</button></div></div>`; };
  draw();
  timerInt=setInterval(()=>{ left--; if(left<=0){ clearInterval(timerInt); beep(); wrap.innerHTML=`<div class="inner"><b>💪 다음 세트 준비!</b><button onclick="stopTimer()">닫기</button></div>`;
    setTimeout(stopTimer,4000); return;} draw(); },1000);
  window._tleft=()=>left; window._tset=(n)=>left=n;
}
function addTimer(n){ window._tset(window._tleft()+n); }
function stopTimer(){ clearInterval(timerInt); $("#timerWrap").classList.add("hidden"); }
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(); const g=a.createGain();
  o.connect(g); g.connect(a.destination); o.frequency.value=880; o.start(); g.gain.setValueAtTime(.25,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5); o.stop(a.currentTime+.5);}catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,80,200]); }

const QA = [

  {k:["근육통","doms","알","뻐근"], a:"운동 후 근육통(DOMS)은 24~72시간 지속되며 성장의 필수 신호는 아니에요. 심하면 앱의 '컨디션 체크'에서 근육통을 높게 주면 그 부위 볼륨을 자동으로 낮춰줍니다. 가벼운 유산소·수면·단백질이 회복에 도움."},
  {k:["몇 번","빈도","주","frequency"], a:"부위별 주 2회 자극이 주 1회보다 성장에 유리하다는 게 메타분석 결론이에요. 이 앱은 PPLUL(월~금)로 모든 부위를 주 2회 치도록 짜여 있습니다."},
  {k:["무게","얼마","증량","progress"], a:"목표 반복수를 RIR 1 이하(거의 실패)로 다 채우면 다음 세션에 자동으로 무게를 올려요(복합 +2.5~5kg, 고립 +1~2kg). 2세션 정체면 10% 낮춰 재정비합니다. 기록만 꾸준히 남기면 제가 다 계산해요."},

function coachReply(t){
  const q=t.toLowerCase();
  for(const item of QA){ if(item.k.some(k=>q.includes(k.toLowerCase()))) return item.a; }
  // 기록 관련 즉답
  if(q.includes("오늘")){ const p=todayPlan(); return p.rest? "오늘은 휴식일이에요 🌙 회복도 훈련입니다.": `오늘은 ${p.day.label} 예정이에요. ${p.exs.length}종목·약 50분. 홈에서 '운동 시작' 누르면 됩니다.`; }
  return "좋은 질문이에요! 지금 베타 코치는 자주 묻는 것(단백질·빈도·증량·근육통·부상·디로드 등)에 과학 근거로 답해요. 곧 클로드 실시간 코치가 붙으면 뭐든 대화할 수 있게 업데이트할게요. 그동안 무게 기록만 꾸준히 남겨주세요 — 프로그램은 제가 알아서 맞춰갑니다. 💪";
}

function spark(pts,max){
  if(pts.length<2){ return `<div class="k" style="margin-top:8px">데이터가 2회 이상 쌓이면 추이선이 그려져요 (현재 ${pts.length}회)</div>`; }
  const W=280,H=70,pad=6; const step=(W-2*pad)/(pts.length-1);
  const pathd=pts.map((p,i)=>`${i===0?'M':'L'}${(pad+i*step).toFixed(1)},${(H-pad-(p/max)*(H-2*pad)).toFixed(1)}`).join(" ");
  const dots=pts.map((p,i)=>`<circle cx="${(pad+i*step).toFixed(1)}" cy="${(H-pad-(p/max)*(H-2*pad)).toFixed(1)}" r="3" fill="#12d18e"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="margin-top:8px"><path d="${pathd}" fill="none" stroke="url(#g)" stroke-width="2.5"/>${dots}
    <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2ea8ee"/><stop offset="1" stop-color="#12d18e"/></linearGradient></defs></svg>`;
}

function updateStreak(){
  // 연속 운동일(주말 제외 관대) 간단 계산
  const days=P().logdays; let streak=0;
  if(days.length){ let d=nowKST(); for(let i=0;i<60;i++){ const k=new Date(d.getTime()-i*86400000+9*3600000).toISOString().slice(0,10);
    const dow=new Date(k).getDay(); if(dow===0||dow===6) continue; if(days.includes(k)) streak++; else if(i>0) break; } }
  $("#streakPill").textContent="🔥 "+streak+"일";
}

function boot(){
  if(!S.current){ $("#app").classList.add("hidden"); $("#onboard").classList.remove("hidden"); renderProfiles(); return; }
  $("#onboard").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#whoBtn").textContent=P().name[0]||"나";
  $("#whoBtn").onclick=()=>nav("settings");
  updateStreak();
  nav("home");
}
boot();
</script>

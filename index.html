<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f1620" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>SOLD PT · AI 트레이너</title>
  <!-- PWA (8/4 대표) — 홈화면에 앱처럼 설치 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1520">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOLD PT">
<style>
  :root{
    --bg:#0f1620; --panel:#18222f; --panel2:#1f2c3c; --line:#2a3a4e;
    --ink:#eaf2fb; --sub:#9db1c7; --brand:#2ea8ee; --brand2:#12d18e;
    --warn:#ffb020; --bad:#ff5d6c; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    overscroll-behavior-y:none;}
  body{max-width:520px; margin:0 auto; padding:0 14px calc(96px + env(safe-area-inset-bottom)); min-height:100vh;}
  h1,h2,h3{margin:0}
  button{font-family:inherit; cursor:pointer; border:none; color:inherit}
  .muted{color:var(--sub)}
  .center{text-align:center}
  .hidden{display:none !important}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0}
  .row{display:flex; align-items:center; gap:10px}
  .between{justify-content:space-between}
  .pill{background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--sub)}
  .btn{background:var(--brand); color:#04121e; font-weight:800; border-radius:14px; padding:15px 16px; font-size:16px; width:100%; text-align:center}
  .btn.sec{background:var(--panel2); color:var(--ink); border:1px solid var(--line); font-weight:700}
  .btn.green{background:var(--brand2)}
  .btn.sm{padding:10px 12px; font-size:14px; width:auto}
  .grad{background:linear-gradient(135deg,#2ea8ee,#12d18e); -webkit-background-clip:text; background-clip:text; color:transparent}
  input,select{font-family:inherit; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:12px; padding:13px; font-size:16px; width:100%}
  input[type=number]{-moz-appearance:textfield}
  label.fld{display:block; font-size:13px; color:var(--sub); margin:12px 0 6px}
  /* top */
  header{display:flex; align-items:center; justify-content:space-between; padding:16px 2px 6px}
  .logo{font-weight:900; letter-spacing:-.5px; font-size:20px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  /* nav */
  nav{position:fixed; left:0; right:0; bottom:0; background:rgba(15,22,32,.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); display:flex; max-width:520px; margin:0 auto; padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1; background:none; padding:11px 0 12px; color:var(--sub); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px}
  nav button .ic{font-size:20px; line-height:1}
  nav button.on{color:var(--brand)}
  /* exercise */
  .ex{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin:12px 0; overflow:hidden}
  .ex.done{opacity:.55}
  .ex-h{padding:14px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .ex-h .t{font-weight:800; font-size:17px}
  .ex-h .m{font-size:12px; color:var(--sub); margin-top:3px}
  .yt{background:#ff2d3722; color:#ff8a92; border:1px solid #ff2d3744; border-radius:10px; padding:8px 10px; font-size:12px; font-weight:700; white-space:nowrap}
  .sets{padding:0 12px 12px}
  .set{display:grid; grid-template-columns:34px 1fr 1fr 46px 40px; gap:8px; align-items:center; padding:7px 4px; border-top:1px solid var(--line)}
  .set .lab{font-size:12px; color:var(--sub); text-align:center}
  .set input{padding:10px; text-align:center; font-size:16px}
  .set .chk{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line); font-size:16px; display:flex;align-items:center;justify-content:center}
  .set .chk.on{background:var(--brand2); color:#04121e; border-color:var(--brand2)}
  .rec{font-size:11px;color:var(--brand2); text-align:center}
  .hint{font-size:12px;color:var(--sub); padding:6px 6px 0}
  /* timer */
  .timer{position:fixed; left:0; right:0; bottom:64px; max-width:520px; margin:0 auto; padding:0 14px; z-index:40}
  .timer .inner{background:linear-gradient(135deg,#12d18e,#2ea8ee); color:#04121e; border-radius:16px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; font-weight:800; box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .timer .big{font-size:26px; font-variant-numeric:tabular-nums}
  .timer button{background:rgba(4,18,30,.15); border-radius:10px; padding:8px 12px; font-weight:800}
  /* chat */
  .chat{display:flex; flex-direction:column; gap:10px; padding-bottom:8px}
  .msg{max-width:86%; padding:11px 14px; border-radius:16px; font-size:15px; line-height:1.5; white-space:pre-wrap}
  .msg.a{background:var(--panel); border:1px solid var(--line); border-top-left-radius:4px; align-self:flex-start}
  .msg.u{background:var(--brand); color:#04121e; border-top-right-radius:4px; align-self:flex-end; font-weight:600}
  .chatbar{position:fixed; left:0;right:0; bottom:64px; max-width:520px; margin:0 auto; padding:8px 14px calc(8px + env(safe-area-inset-bottom)); background:rgba(15,22,32,.95); backdrop-filter:blur(8px); border-top:1px solid var(--line); display:flex; gap:8px}
  .chatbar input{flex:1}
  .chatbar button{background:var(--brand); color:#04121e; font-weight:800; border-radius:12px; padding:0 16px}
  /* progress */
  .stat{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .stat .b{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px}
  .stat .b .n{font-size:22px; font-weight:900}
  .stat .b .l{font-size:11px; color:var(--sub)}
  .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2ea8ee,#12d18e)}
  .chip{display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:6px 10px; margin:4px 4px 0 0; font-size:12px}
  .chip b{color:var(--brand2)}
  svg{display:block;width:100%}
  .tag{font-size:11px; font-weight:800; padding:3px 8px; border-radius:6px}
  .tag.push{background:#2ea8ee22;color:#7cc9f5}
  .tag.pull{background:#12d18e22;color:#6fe3b6}
  .tag.legs{background:#ffb02022;color:#ffce6b}
  .tag.upper{background:#a879ff22;color:#c3a0ff}
  .tag.lower{background:#ff7a5922;color:#ffab93}
  .tag.rest{background:#61728822;color:#9db1c7}
  .seg{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px}
  .seg button{flex:1; padding:9px; border-radius:9px; font-size:13px; color:var(--sub); background:none; font-weight:700}
  .seg button.on{background:var(--brand); color:#04121e}
  .note{background:linear-gradient(135deg,#18222f,#1f2c3c); border:1px solid var(--line); border-radius:14px; padding:14px; font-size:14px; line-height:1.6}
  .note .h{font-weight:800; color:var(--brand2); margin-bottom:6px}
  .k{font-size:12px;color:var(--sub)}
  .toast{position:fixed; left:50%; top:20px; transform:translateX(-50%); background:#04121e; border:1px solid var(--brand2); color:var(--brand2); padding:12px 18px; border-radius:12px; font-weight:800; z-index:99; box-shadow:0 8px 30px rgba(0,0,0,.5)}
  /* gamification */
  .game{background:linear-gradient(135deg,#1a2740,#12203a); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0}
  .game .lv{display:flex; align-items:center; gap:12px}
  .ring{position:relative; width:64px; height:64px; flex:0 0 64px}
  .ring .txt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900}
  .ring .txt small{font-size:9px; color:var(--sub); font-weight:700}
  .lvlbadge{font-size:13px; font-weight:900; color:#04121e; background:linear-gradient(135deg,#ffd76b,#ffb020); padding:3px 9px; border-radius:999px}
  .xpbar{height:9px;background:#0d1826;border-radius:99px;overflow:hidden;margin-top:7px;border:1px solid var(--line)}
  .xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#ffd76b,#ffb020)}
  .badges{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
  .bdg{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:9px 4px; text-align:center}
  .bdg.lock{opacity:.32; filter:grayscale(1)}
  .bdg .i{font-size:22px; line-height:1.1}
  .bdg .n{font-size:9.5px; color:var(--sub); margin-top:3px; line-height:1.1}
  .motiv{font-size:13px; color:#ffd76b; font-weight:700; margin-top:10px; line-height:1.5}
  /* celebrate */
  .cele{position:fixed; inset:0; z-index:90; background:rgba(6,12,20,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center; overflow:hidden}
  .cele h1{font-size:30px; margin-bottom:6px}
  .cele .sub{color:var(--sub); margin-bottom:20px}
  .cele .box{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; width:100%; max-width:340px}
  .cele .g2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .cele .g2 .n{font-size:24px; font-weight:900} .cele .g2 .l{font-size:11px; color:var(--sub)}
  .cele .xpg{font-size:16px; font-weight:900; color:#ffd76b; margin-top:14px}
  .cele .newb{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .cele .newb .b{background:linear-gradient(135deg,#ffd76b22,#ffb02022); border:1px solid #ffb02055; border-radius:12px; padding:8px 12px; font-size:13px; font-weight:800; color:#ffd76b}
  .cele .mv{color:#eaf2fb; font-size:15px; font-weight:700; margin:18px 0 22px; line-height:1.6}
  .cf{position:fixed; top:-20px; width:9px; height:14px; z-index:91; border-radius:2px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.9}}
/* 코치 모드 — 세로 전체화면 (8/4 대표) */
body.coach-on > .app, body.coach-on > nav, body.coach-on .tabbar, body.coach-on #timerWrap { display:none !important; }
#coachView{ position:fixed; inset:0; z-index:9999; background:linear-gradient(180deg,#0b1520 0%,#0a1118 100%); overflow:hidden; }
.co-wrap{ height:100%; display:flex; flex-direction:column; align-items:center; padding:16px 18px calc(20px + env(safe-area-inset-bottom)); text-align:center; }
.co-top{ width:100%; display:flex; align-items:center; gap:10px; }
.co-x{ width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); color:#cfe3f5; font-size:17px; cursor:pointer; }
.co-prog{ flex:1; font-size:13px; color:#8fa8bd; letter-spacing:.3px; }
.co-bar{ width:100%; height:5px; border-radius:3px; background:rgba(255,255,255,.08); margin:12px 0 4px; overflow:hidden; }
.co-bar i{ display:block; height:100%; background:linear-gradient(90deg,#38bdf8,#22d3a7); transition:width .35s; }

.co-exname{ font-size:26px; font-weight:900; color:#eaf4ff; margin:14px 0 4px; line-height:1.25; word-break:keep-all; }
.co-yt{ margin-top:8px; padding:9px 16px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:700;
  background:rgba(255,80,80,.13); border:1px solid rgba(255,110,110,.35); color:#ff9b9b; }
.co-yt:active{ transform:scale(.97); }
.co-eq{ font-size:12.5px; color:#7cc4ff; background:rgba(124,196,255,.1); border:1px solid rgba(124,196,255,.24); border-radius:8px; padding:4px 10px; display:inline-block; }
.co-machine{ width:min(72vw,260px); height:120px; margin:10px 0 4px; opacity:.9; }

.co-body{ flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
.co-phase{ font-size:15px; font-weight:800; color:#9fd0a8; letter-spacing:.5px; }
.co-phase.go{ color:#22d3a7; }
.co-phase.rest{ color:#ffd479; }
.co-phase.move{ color:#8ab4ff; }
.co-target{ font-size:30px; color:#dbe9f7; font-weight:800; letter-spacing:-.5px; }
.co-target b{ color:#fff; font-size:40px; }
.co-target small{ font-size:17px; opacity:.75; margin-left:2px; }
.co-count{ font-size:82px; font-weight:900; color:#fff; line-height:1; letter-spacing:-2px; font-variant-numeric:tabular-nums; margin:6px 0; }
.co-count.sm{ font-size:46px; color:#cfe3f5; }
.co-sub{ font-size:14px; color:#8fa8bd; }
.co-next{ font-size:15px; color:#bcd3e6; }
.co-next b{ color:#fff; }
.co-movename{ font-size:22px; font-weight:800; color:#fff; margin:6px 0; }

.co-btn{ width:100%; max-width:420px; padding:16px; border-radius:14px; border:0; cursor:pointer;
  background:linear-gradient(90deg,#22d3a7,#38bdf8); color:#04212b; font-size:17px; font-weight:900; margin-top:10px; }
.co-btn.big{ padding:22px; font-size:20px; }
.co-btn.ghost{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); color:#dbe9f7; font-weight:700; }
.co-btn:active{ transform:scale(.98); }
.co-row{ display:flex; gap:10px; width:100%; max-width:420px; }
.co-row .co-btn{ margin-top:10px; }

.co-feel{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:6px; }
.co-feel span{ font-size:12.5px; color:#8fa8bd; width:100%; }
.co-feel button{ font-size:13px; padding:9px 13px; border-radius:10px; cursor:pointer;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15); color:#dbe9f7; }
.co-fin{ font-size:64px; margin-top:40px; }
.co-sum{ font-size:16px; color:#bcd3e6; margin-top:6px; }
.co-wrap.done{ justify-content:center; }
@media(max-height:700px){
  .co-count{ font-size:62px; } .co-machine{ height:88px; } .co-exname{ font-size:22px; }
  .co-target b{ font-size:33px; }
}


/* 설치 안내 바 */
#installBar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:9998;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;
  background:rgba(18,32,46,.97);border:1px solid rgba(124,196,255,.28);box-shadow:0 8px 28px rgba(0,0,0,.45)}
#installBar span{flex:1;font-size:13.5px;color:#dbe9f7}
#installBar button{padding:9px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:800;font-size:13px}
#installBar #instYes{background:linear-gradient(90deg,#22d3a7,#38bdf8);color:#04212b}
#installBar #instNo{background:rgba(255,255,255,.08);color:#9fb4c7}

/* 계정 전환 시트 */
#acctSheet{position:fixed;inset:0;z-index:10000;display:flex;align-items:flex-end;justify-content:center}
.acct-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.acct-box{position:relative;width:100%;max-width:460px;background:#111e2b;border-radius:20px 20px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1)}
.acct-t{font-size:15px;font-weight:800;color:#eaf4ff;margin:2px 0 12px;text-align:center}
.acct-row{width:100%;display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:9px;
  border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  color:#dbe9f7;cursor:pointer;text-align:left}
.acct-row.on{border-color:#22d3a7;background:rgba(34,211,167,.1)}
.acct-av{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#22d3a7,#38bdf8);color:#04212b;font-weight:900;font-size:17px}
.acct-info{flex:1;display:flex;flex-direction:column;gap:2px}
.acct-info b{font-size:16px;color:#fff}
.acct-info small{font-size:12px;color:#8fa8bd}
.acct-now{font-size:11.5px;color:#22d3a7;font-weight:800}
.acct-go{font-size:19px;color:#5f7f9b}
.acct-add,.acct-close{width:100%;padding:13px;border-radius:12px;cursor:pointer;font-size:14px;margin-top:8px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cfe3f5}
.acct-close{background:transparent;border:0;color:#8fa8bd}
</style>
</head>
<body>

<!-- ===== ONBOARD / PROFILE ===== -->
<div id="onboard" class="hidden">
  <div style="padding:48px 4px 8px">
    <div class="logo grad" style="font-size:34px">SOLD PT</div>
    <p class="muted" style="margin-top:8px">과학 기반 AI 트레이너 · 베타</p>
  </div>
  <div class="card">
    <h3>누구세요?</h3>
    <p class="k" style="margin:6px 0 14px">기록은 사람별로 따로 저장돼요.</p>
    <div id="profileList"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <header>
    <div class="logo grad">SOLD PT</div>
    <div class="row">
      <span id="streakPill" class="pill">🔥 0일</span>
      <button class="avatar" id="whoBtn">나</button>
    </div>
  </header>

  <!-- HOME -->
  <section id="view-home"></section>
  <!-- WORKOUT -->
  <section id="view-workout" class="hidden"></section>
  <!-- CHAT -->
  <section id="view-chat" class="hidden"></section>
  <!-- PROGRESS -->
  <section id="view-progress" class="hidden"></section>
  <!-- SETTINGS -->
  <section id="view-settings" class="hidden"></section>

  <div id="timerWrap" class="timer hidden"></div>

  <nav>
    <button data-nav="home" class="on"><span class="ic">🏠</span>홈</button>
    <button data-nav="workout"><span class="ic">🏋️</span>운동</button>
    <button data-nav="chat"><span class="ic">💬</span>코치</button>
    <button data-nav="progress"><span class="ic">📈</span>기록</button>
    <button data-nav="settings"><span class="ic">⚙️</span>설정</button>
  </nav>
</div>

<script>
/* ============================================================
   SOLD PT — 과학 기반 개인 트레이너 (베타, 클라이언트 전용/localStorage)
   - 무게/횟수/RIR 영구 기록 → 점진적 과부하 자동 반영
   - PPLUL 분할, 오토레귤레이션(컨디션 반영), 6주 디로드
   - 운동방법 → 유튜브, 세트 완료 → 쉬는시간 타이머
   ============================================================ */
"use strict";
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const todayKey = ()=>{const d=new Date(Date.now()+9*3600*1000); return d.toISOString().slice(0,10);};
const nowKST = ()=> new Date(Date.now()+9*3600*1000);
const round = (n,step)=> Math.round(n/step)*step;
const toast = (m)=>{const t=el('div','toast',m); document.body.appendChild(t); setTimeout(()=>t.remove(),1900);};

/* ---------- 운동 DB (근거: 부위 주2회 빈도, 6~15렙 다양화, RIR 관리) ---------- */

const weekStart = ()=>{ const d=nowKST(); const day=(d.getDay()+6)%7; const m=new Date(d.getTime()-day*86400000); return m.toISOString().slice(0,10); };
function weekDoneCount(){ const ws=weekStart(); return P().logdays.filter(k=>k>=ws).length; }
function activeDays(){ const s=new Set(P().logdays); (P().cardio||[]).forEach(c=>s.add(c.date)); return s; }
function streakCount(){ const A=activeDays(); if(!A.size) return 0; let s=0;
  for(let i=0;i<120;i++){ const t=new Date(nowKST().getTime()-i*86400000); const k=t.toISOString().slice(0,10); const dow=t.getUTCDay();
    if(A.has(k)) s++; else if(dow===0||dow===6) continue; else if(i>0) break; } return s; }
function gameStats(){
  const sessions=P().logdays.length;
  const hist=Object.values(P().history).flat();
  const sets=hist.reduce((a,h)=>a+h.sets.filter(s=>s.w!=null||s.reps!=null).length,0);
  const prs=Object.values(P().history).filter(h=>h.some(x=>x.pr)).length;
  const vol=hist.reduce((a,h)=>a+h.sets.reduce((x,s)=>x+((s.w||0)*(s.reps||0)),0),0);
  const cardio=(P().cardio||[]).length;
  const xp=sessions*50+sets*5+prs*30+cardio*20;
  const per=300; const level=Math.floor(xp/per)+1;
  return {sessions,sets,prs,vol,cardio,xp,level,xpIn:xp%per,xpFor:per,streak:streakCount(),week:weekDoneCount(),target:P().weeklyTarget||4};
}

/* ---------- 점진적 과부하 엔진 ---------- */
// 지난 기록으로 오늘 추천무게 계산
function recommend(exId){
  const ex = EX[exId]; const hist = (P().history[exId]||[]);
  if(!ex.start && ex.inc===0) return {w:null, reps:ex.rep[1], note:"맨몸 · 반복수 목표"};
  if(hist.length===0) return {w: ex.start, reps: ex.rep[0], note:"첫 세션 · 가벼운 무게로 폼부터"};
  const last = hist[hist.length-1];
  const sets = last.sets.filter(s=>s.w!=null||s.reps!=null);
  if(sets.length===0) return {w:ex.start, reps:ex.rep[0], note:"기록 없음"};
  const w = Math.max(...sets.map(s=>+s.w||0));
  // 지난 세션에 '무거웠다'를 눌렀으면 올리지 않는다 (8/4 대표)
  const lastFeel = (last.planSets||[]).filter(p=>p.feel).map(p=>p.feel);
  const feltHeavy = lastFeel.filter(f=>f==="heavy").length >= 1;
  const feltLight = lastFeel.length>0 && lastFeel.every(f=>f==="light");
  if(feltHeavy) return {w: w, reps: ex.rep[0], note:"지난번 무겁다고 하셔서 같은 무게로 한 번 더 💪"};
  if(feltLight) return {w: round(w+ex.inc, ex.inc||1.25), reps:ex.rep[0], note:`가볍다고 하셔서 +${ex.inc}kg 올렸어요 🔼`};
  const allTop = sets.every(s=> (+s.reps||0) >= ex.rep[1]);
  const lowRIR = sets.every(s=> (s.rir==null? true : +s.rir<=1));
  const failed = sets.filter(s=> (+s.reps||0) < ex.rep[0]).length;
  if(allTop && lowRIR) return {w: round(w+ex.inc, ex.inc||1.25), reps:ex.rep[0], note:`지난주 목표 달성 → +${ex.inc}kg 🔼`};
  const fails = (P().history[exId]||[]).slice(-2).filter(h=>h.failed).length;
  if(failed>=2 || fails>=2) return {w: round(w*0.9, ex.inc||1.25), reps:ex.rep[0], note:"정체 감지 → 10%↓ 후 재정비"};
  return {w: w, reps: Math.min(ex.rep[1], (Math.max(...sets.map(s=>+s.reps||0))+1)), note:"같은 무게로 반복수 +1 도전"};
}

function estimate1RM(w,reps){ if(!w||!reps) return 0; return Math.round(w*(1+reps/30)); }

/* 세트별 지시 생성 (8/4 대표 — "오늘 뭘 몇 kg로 할지 다 정해줘")
   복합운동은 워밍업 2세트를 앞에 붙인다. 본세트는 목표 무게·횟수를 명시.
   반환: [{w, reps, kind:"warm"|"work", label}] */
function buildSets(ex, setN, workW, workReps){
  const out=[];
  // 워밍업 1세트만 (8/4 대표 — 아침엔 시간이 없다). 본세트의 60%로 관절만 풀고 바로 진입.
  if(workW!=null && ex.type==="comp" && workW >= (ex.inc||2.5)*4){
    const w1 = round(workW*0.6, ex.inc||2.5);
    out.push({w:w1, reps:Math.min(10, workReps+2), kind:"warm", label:"워밍업"});
  }
  for(let i=0;i<setN;i++){
    out.push({w:workW, reps:workReps, kind:"work", label:"본세트 "+(i+1)});
  }
  return out;
}

/* 세트 사이 무게 조정 — 운동 중 [무거웠다/가벼웠다] 누르면 즉시 반영.
   heavy: 다음 세트부터 10%↓ · light: 5%↑ · 나머지 세트에 모두 적용 */
function adjustFrom(planSets, fromIdx, dir, ex){
  const step = dir==="heavy" ? 0.9 : dir==="light" ? 1.05 : 1;
  if(step===1) return;
  for(let i=fromIdx+1;i<planSets.length;i++){
    if(planSets[i].w==null) continue;
    planSets[i].w = round(planSets[i].w*step, ex.inc||2.5);
    planSets[i].adj = dir;
  }
}

/* 주차 인덱스 — 첫 기록일 기준 몇 주째인가 (종목 로테이션용) */
function weekIndex(){
  const days = P().logdays;
  if(!days || !days.length) return 0;
  const first = new Date(days[0] + "T00:00:00+09:00");
  const diff = Math.floor((nowKST() - first) / 86400000);
  return Math.max(0, Math.floor(diff / 7));
}

/* ---------- 오늘 프로그램 생성 (50분·오토레귤레이션) ---------- */
function todayPlan(){
  const dow = nowKST().getDay();
  const day = SPLIT[dow];
  if(day.key==="rest") return {rest:true, day};
  const eq = P().equip;
  const avail = id => EX[id].eq.every(t=> eq.includes(t) || t==="");
  let pool = day.pool.filter(avail);
  // 부족하면 다른 요일 풀에서 같은 성격 보충
  if(pool.length<5){ for(const k in SPLIT){ for(const id of SPLIT[k].pool){ if(pool.length>=6) break; if(avail(id)&&!pool.includes(id)) pool.push(id);} } }
  // 복합 먼저, 고립 뒤 — 5~6개 (50분)
  // 부위 쿼터 (8/4) — 요일 성격에 맞게 부위를 배분한다.
  //   기존엔 풀 앞에서 잘라 PUSH인데 가슴만 6개, UPPER는 PUSH와 동일한 종목이 나왔다.
  //   [정규식, 뽑을 개수] 순서대로 채우고, 모자라면 남은 풀에서 보충한다.
  const QUOTA = {
    push:  [[/가슴/,2],[/어깨/,2],[/삼두/,1]],
    pull:  [[/등/,3],[/이두/,2]],
    legs:  [[/사두|하체/,2],[/햄/,2],[/둔근|내전/,1]],
    upper: [[/등/,2],[/가슴/,2],[/어깨/,1]],
    lower: [[/둔근|내전/,2],[/햄/,2],[/사두|하체/,1]],
  }[day.key] || [];

  // 주차 로테이션 — 매주 다른 기구를 쓰게. 같은 주에는 같은 조합(그날 다시 열어도 안 바뀜).
  const wk = weekIndex();
  const rot = (arr, take, seed) => {
    if(!arr.length) return [];
    const out=[]; for(let i=0;i<take && i<arr.length;i++) out.push(arr[(wk*take + i + seed) % arr.length]);
    return out;
  };

  let chosen = [];
  QUOTA.forEach(([re, cnt], qi)=>{
    // 복합 먼저 채우고 부족하면 고립으로 — 큰 근육을 앞에 두기 위함
    const hit = pool.filter(id=>re.test(EX[id].m) && !chosen.includes(id));
    const c = hit.filter(id=>EX[id].type==="comp");
    const iso = hit.filter(id=>EX[id].type==="iso");
    const ordered = [...c, ...iso];
    chosen.push(...rot(ordered, cnt, qi).filter(x=>!chosen.includes(x)));
  });
  // 쿼터로 못 채웠으면(기구를 꺼둔 경우 등) 남은 풀에서 보충
  if(chosen.length<4){
    for(const id of pool){ if(chosen.length>=5) break; if(!chosen.includes(id)) chosen.push(id); }
  }
  // 복합 → 고립 순으로 정렬 (무거운 운동을 앞에)
  //  총 50분 = 근력 35분 + 유산소 15분 (8/4 대표). 6종목이면 근력만 50분이라 5종목으로.
  chosen = [...chosen.filter(id=>EX[id].type==="comp"), ...chosen.filter(id=>EX[id].type==="iso")].slice(0,5);
  // 오토레귤레이션: 오늘 컨디션
  const r = P().readiness[todayKey()];
  let setMod = 0, wMod = 1, coach="";
  if(r){
    const score = (r.sleep+r.energy+(6-r.soreness)+(6-r.stress))/4; // 1~5
    if(score<=2.3){ setMod=-1; wMod=0.9; coach="컨디션이 낮아 볼륨·강도를 낮췄어요. 오늘은 회복 우선."; }
    else if(score>=4.3){ setMod=+0; wMod=1.03; coach="컨디션 최상! 마지막 세트에서 조금 더 밀어붙여도 좋아요."; }
    else coach="컨디션 양호 — 계획대로 진행합니다.";
  }
  const exs = chosen.map((id,i)=>{
    const ex=EX[id]; const rec=recommend(id);
    let setN = ex.type==="comp"? (i===0?4:3) : 3; setN=Math.max(2,setN+setMod);
    const w = rec.w==null? null : round(rec.w*wMod, ex.inc||1.25);
    const planSets = buildSets(ex, setN, w, rec.reps);
    return {id, name:ex.name, m:ex.m, type:ex.type, rep:ex.rep, sets:setN, recW:w, recReps:rec.reps, note:rec.note, rest: ex.type==="comp"?60:45,   // 8/4 대표 — 아침에 빨리 끝내야 해서 단축 yt:ex.yt,
            br:ex.br||"", wt:ex.wt||"", no:ex.no||"", eq:ex.eq||[], planSets};
  });
  const deloadWk = isDeloadWeek();
  if(deloadWk){ exs.forEach(e=>{ e.sets=Math.max(2,e.sets-1); e.recW = e.recW==null?null:round(e.recW*0.9, EX[e.id].inc||1.25); }); }
  return {rest:false, day, exs, coach, deload:deloadWk};
}

// 6주 주기 · 매 6주차 디로드 (첫 기록일 기준)
function isDeloadWeek(){
  const days = P().logdays;
  if(!days.length) return false;
  const first = new Date(days[0]+"T00:00:00");
  const wk = Math.floor((nowKST()-first)/(7*86400000));
  return wk>0 && (wk%6===5);
}

function ensureReadiness(cb){

  wrap.innerHTML=`<h2>오늘 컨디션 10초 체크</h2><p class="k">몸 상태에 맞춰 강도를 자동 조절해요(오토레귤레이션).</p>
    ${q("q_sleep","😴 수면","나쁨","충분")}${q("q_energy","⚡ 활력","축 처짐","팔팔")}

function equipBadge(e){
  if(!e.br || e.wt==="free") return "";
  const wtLabel = e.wt==="pin" ? "핀" : e.wt==="plate" ? "원판" : "";
  const parts = [e.br];
  if(wtLabel) parts.push(wtLabel);
  if(e.no && e.no!=="—") parts.push("No."+e.no);
  return '<div class="equip">🏋️ '+parts.join(" · ")+'</div>';
}

function collectWorkout(){
  const out={sets_by:{}, plan_by:{}};
  // 운동 중 조절한 무게를 같이 저장 (8/4) — 안 하면 화면 다시 그릴 때 원래 무게로 돌아간다.
  if(curPlan && curPlan.exs){ curPlan.exs.forEach(e=>{ if(e._live) out.plan_by[e.id]=e._live; }); }
  document.querySelectorAll("#view-workout .ex").forEach(card=>{
    const id=card.dataset.ex; const sets=[];
    card.querySelectorAll(".set").forEach((row,idx)=>{
      if(idx===0) return; // header
      const w=row.querySelector("[data-w]"), r=row.querySelector("[data-r]"), rir=row.querySelector("[data-rir]"), chk=row.querySelector("[data-chk]");
      if(!w) return;
      sets.push({w:w.value===""?null:+w.value, reps:r.value===""?null:+r.value, rir:rir.value===""?null:+rir.value, done:chk.classList.contains("on")});
    });
    out.sets_by[id]=sets;
  });
  return out;
}
function saveWorkoutDraft(){
  const c=collectWorkout(); const tk=todayKey();
  P().done[tk]=P().done[tk]||{};
  for(const id in c.sets_by){
    P().done[tk][id]={sets:c.sets_by[id], planSets:(c.plan_by||{})[id]||null};
  }
  persist();
}
function finishWorkout(){
  const c=collectWorkout(); const tk=todayKey(); let newPR=0, logged=0;
  for(const id in c.sets_by){
    const sets=c.sets_by[id].filter(s=> s.w!=null||s.reps!=null);
    if(!sets.length) continue; logged++;
    const livePlan=(c.plan_by||{})[id]||null;
    const ex=EX[id];
    const failed = sets.filter(s=> (s.reps||0) < ex.rep[0]).length>=2;
    // PR 판정 (추정 1RM 최고 갱신)
    const best = Math.max(...sets.map(s=>estimate1RM(s.w,s.reps)));
    const prevBest = Math.max(0,...(P().history[id]||[]).map(h=>h.e1rm||0));
    const pr = best>prevBest && best>0;
    if(pr) newPR++;
    P().history[id]=P().history[id]||[];
    P().history[id].push({date:tk, sets, e1rm:best, failed, pr, planSets:livePlan});
  }
  if(logged===0){ toast("기록할 세트가 없어요"); return; }
  // 오늘 볼륨·세트 집계
  let vol=0, setsCount=0;
  for(const id in c.sets_by){ c.sets_by[id].forEach(s=>{ if(s.w!=null||s.reps!=null){ setsCount++; vol+=(s.w||0)*(s.reps||0);} }); }
  const firstToday = !P().logdays.includes(tk);
  if(firstToday) P().logdays.push(tk);
  P().logdays.sort();
  persist();
  // XP·레벨·배지
  const xpGain = (firstToday?50:0) + setsCount*5 + newPR*30;
  const g=gameStats();
  const levelBefore=Math.floor((g.xp-xpGain)/g.xpFor)+1;
  const levelUp = g.level>levelBefore;
  const newBadges = syncBadges(g);
  persist();
  celebrate({vol, sets:setsCount, xpGain, levelUp, newBadges, newPR:newPR>0});
}

let timerInt=null;
function startTimer(sec, label){
  clearInterval(timerInt);
  const wrap=$("#timerWrap"); wrap.classList.remove("hidden");
  let left=sec||60;
  const draw=()=>{ wrap.innerHTML=`<div class="inner"><div><div style="font-size:12px;opacity:.8">쉬는 시간 · ${label||''}</div>
    <div class="big">${String(Math.floor(left/60)).padStart(1,'0')}:${String(left%60).padStart(2,'0')}</div></div>
    <div class="row"><button onclick="addTimer(15)">+15초</button><button onclick="stopTimer()">건너뛰기</button></div></div>`; };
  draw();
  timerInt=setInterval(()=>{ left--; if(left<=0){ clearInterval(timerInt); beep(); wrap.innerHTML=`<div class="inner"><b>💪 다음 세트 준비!</b><button onclick="stopTimer()">닫기</button></div>`;
    setTimeout(stopTimer,4000); return;} draw(); },1000);
  window._tleft=()=>left; window._tset=(n)=>left=n;
}
function addTimer(n){ window._tset(window._tleft()+n); }
function stopTimer(){ clearInterval(timerInt); $("#timerWrap").classList.add("hidden"); }
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(); const g=a.createGain();
  o.connect(g); g.connect(a.destination); o.frequency.value=880; o.start(); g.gain.setValueAtTime(.25,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5); o.stop(a.currentTime+.5);}catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,80,200]); }

const QA = [
  {k:["단백질","프로틴","protein"], a:"근성장엔 하루 체중 1kg당 1.6~2.2g 단백질이 근거 기반 권장량이에요. 80kg이면 약 130~175g. 끼니마다 20~40g씩 나눠 드세요."},
  {k:["근육통","doms","알","뻐근"], a:"운동 후 근육통(DOMS)은 24~72시간 지속되며 성장의 필수 신호는 아니에요. 심하면 앱의 '컨디션 체크'에서 근육통을 높게 주면 그 부위 볼륨을 자동으로 낮춰줍니다. 가벼운 유산소·수면·단백질이 회복에 도움."},
  {k:["몇 번","빈도","주","frequency"], a:"부위별 주 2회 자극이 주 1회보다 성장에 유리하다는 게 메타분석 결론이에요. 이 앱은 PPLUL(월~금)로 모든 부위를 주 2회 치도록 짜여 있습니다."},
  {k:["무게","얼마","증량","progress"], a:"목표 반복수를 RIR 1 이하(거의 실패)로 다 채우면 다음 세션에 자동으로 무게를 올려요(복합 +2.5~5kg, 고립 +1~2kg). 2세션 정체면 10% 낮춰 재정비합니다. 기록만 꾸준히 남기면 제가 다 계산해요."},
  {k:["살","체지방","다이어트","감량","cut"], a:"체지방 감량의 핵심은 '주당 체중 0.5~1% 감소' 수준의 완만한 칼로리 적자 + 단백질 유지 + 근력운동으로 근손실 방지예요. 이 앱 프로그램을 유지하면서 식단에서 적자를 만드세요."},
  {k:["실패","failure","rir","한계"], a:"매 세트 완전 실패까지 갈 필요 없어요. RIR 1~2(1~2회 더 할 수 있는 정도)가 성장 대비 회복·부상 위험이 가장 좋습니다. 마지막 세트만 가끔 실패까지."},
  {k:["디로드","deload","쉬","피곤"], a:"6주마다 볼륨을 낮추는 '디로드 주간'이 자동 적용돼요. 피로 누적·정체·관절 통증을 예방합니다. 그 주엔 세트·무게가 자동으로 줄어요."},
  {k:["아프","부상","통증","injury"], a:"⚠️ 관절에 찌릿한 통증(근육통과 다름)이 있으면 그 운동을 멈추고 대체 종목으로 바꾸세요. 지속되면 병원 먼저입니다. 저는 운동 코치지 의료진이 아니에요 — 이 선은 꼭 지켜주세요."},
  {k:["워밍업","준비운동","warm"], a:"본 세트 전 가벼운 무게로 2~3세트 워밍업하세요(예: 본세트의 50%×8, 70%×5). 부상 예방 + 신경 활성화로 첫 세트 수행력이 올라갑니다."},
];
function coachReply(t){
  const q=t.toLowerCase();
  for(const item of QA){ if(item.k.some(k=>q.includes(k.toLowerCase()))) return item.a; }
  // 기록 관련 즉답
  if(q.includes("오늘")){ const p=todayPlan(); return p.rest? "오늘은 휴식일이에요 🌙 회복도 훈련입니다.": `오늘은 ${p.day.label} 예정이에요. ${p.exs.length}종목·근력 35분 + 유산소 15분(총 50분). 홈에서 '운동 시작' 누르면 됩니다.`; }
  return "좋은 질문이에요! 지금 베타 코치는 자주 묻는 것(단백질·빈도·증량·근육통·부상·디로드 등)에 과학 근거로 답해요. 곧 클로드 실시간 코치가 붙으면 뭐든 대화할 수 있게 업데이트할게요. 그동안 무게 기록만 꾸준히 남겨주세요 — 프로그램은 제가 알아서 맞춰갑니다. 💪";
}

    const exsWith=Object.keys(P().history).filter(id=>(P().history[id]||[]).length>0);
    if(!exsWith.length){ v.appendChild(el("div","note","아직 기록이 없어요. 운동을 완료하면 종목별 추정 1RM(최대중량) 그래프가 여기 그려집니다 📈")); return; }
    exsWith.forEach(id=>{
      const h=P().history[id]; const ex=EX[id];
      const pts=h.map(x=>x.e1rm||0); const max=Math.max(...pts,1); const best=Math.max(...pts);
      const card=el("div","card");
      card.innerHTML=`<div class="row between"><b>${ex.name}</b><span class="chip">최고 <b>${best}kg</b> 추정1RM ${h.some(x=>x.pr)?'🏆':''}</span></div>${spark(pts,max)}
        <div class="k" style="margin-top:6px">최근: ${h.slice(-1)[0].sets.filter(s=>s.w).map(s=>`${s.w}kg×${s.reps}`).join(", ")||"—"}</div>`;
      v.appendChild(card);
    });
  } else {
    const days=[...new Set([...P().logdays, ...(P().cardio||[]).map(c=>c.date)])].sort().reverse();
    if(!days.length){ v.appendChild(el("div","note","운동 일지가 비어 있어요. 첫 운동을 완료해보세요!")); return; }
    days.forEach(dk=>{
      const items=[]; for(const id in P().history){ const rec=P().history[id].find(x=>x.date===dk); if(rec) items.push({id,rec}); }
      const cardios=(P().cardio||[]).filter(c=>c.date===dk);
      const card=el("div","card");
      card.innerHTML=`<b>${dk}</b> <span class="k">· ${items.length?items.length+"종목":""}${items.length&&cardios.length?" · ":""}${cardios.length?"유산소 "+cardios.length:""}</span>
        <div style="margin-top:8px">${items.map(it=>`<div class="row between" style="padding:5px 0;border-top:1px solid var(--line)">
          <span>${EX[it.id].name} ${it.rec.pr?'🏆':''}</span>
          <span class="k">${it.rec.sets.filter(s=>s.w).map(s=>`${s.w}×${s.reps}`).join(" · ")||"완료"}</span></div>`).join("")}
          ${cardios.map(c=>`<div class="row between" style="padding:5px 0;border-top:1px solid var(--line)">
          <span>🏃 ${c.type}</span><span class="k">${c.min}분${c.dist?" · "+c.dist+"km":""} · ${c.intensity}</span></div>`).join("")}</div>`;
      v.appendChild(card);
    });
  }
}
function spark(pts,max){
  if(pts.length<2){ return `<div class="k" style="margin-top:8px">데이터가 2회 이상 쌓이면 추이선이 그려져요 (현재 ${pts.length}회)</div>`; }
  const W=280,H=70,pad=6; const step=(W-2*pad)/(pts.length-1);
  const pathd=pts.map((p,i)=>`${i===0?'M':'L'}${(pad+i*step).toFixed(1)},${(H-pad-(p/max)*(H-2*pad)).toFixed(1)}`).join(" ");
  const dots=pts.map((p,i)=>`<circle cx="${(pad+i*step).toFixed(1)}" cy="${(H-pad-(p/max)*(H-2*pad)).toFixed(1)}" r="3" fill="#12d18e"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="margin-top:8px"><path d="${pathd}" fill="none" stroke="url(#g)" stroke-width="2.5"/>${dots}
    <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2ea8ee"/><stop offset="1" stop-color="#12d18e"/></linearGradient></defs></svg>`;
}

/* ═══════════════════════════════════════════════════════════════
   코치 모드 — 한 화면에 한 세트씩, 카운트다운으로 이끈다 (8/4 대표)
     "1세트 시작! → 끝 버튼 → 휴식 카운트 → 5초 후 자동 시작
      운동 끝나면 → 다음 운동 이동 → 이동완료 → 5초 후 시작"
   무게·횟수는 앱이 정해서 크게 보여준다. 사용자는 [끝] 버튼만 누르면 된다.
   ═══════════════════════════════════════════════════════════════ */
let CO = null;   // {plan, ei, si, phase, t, timer}
// phase: "ready"(5초 카운트다운) | "work"(운동중) | "rest"(휴식) | "move"(다음운동 이동) | "done"

function coachStart(){
  const plan = todayPlan();
  if(plan.rest){ toast("오늘은 휴식일이에요 🌙"); return; }
  CO = {plan, ei:0, si:0, phase:"ready", t:5, timer:null, log:{}};
  document.body.classList.add("coach-on");
  keepAwake(true);   // 운동 중 화면 꺼짐 방지 (8/4)
  coachTick();
  coachRender();
}
function coachStop(){
  if(CO && CO.timer) clearInterval(CO.timer);
  CO = null;
  document.body.classList.remove("coach-on");
  keepAwake(false);
  const w = $("#coachView"); if(w) w.remove();
  renderWorkout();
}
function coachEx(){ return CO.plan.exs[CO.ei]; }
function coachSets(){ const e=coachEx(); return e.planSets && e.planSets.length ? e.planSets : [{w:e.recW, reps:e.recReps, label:"1세트", kind:"work"}]; }
function coachSet(){ return coachSets()[CO.si]; }

/* 1초 타이머 — ready/rest/move 는 카운트다운, work 는 경과시간 */
function coachTick(){
  if(CO.timer) clearInterval(CO.timer);
  CO.timer = setInterval(()=>{
    if(!CO) return;
    if(CO.phase==="work"){ CO.t++; coachPaint(); return; }
    CO.t--;
    if(CO.t<=0){
      if(CO.phase==="ready"){ CO.phase="work"; CO.t=0; beep(2); }
      else if(CO.phase==="rest"){ CO.phase="ready"; CO.t=5; beep(1); }
      else if(CO.phase==="move"){ CO.phase="ready"; CO.t=5; beep(1); }
      coachRender(); return;
    }
    if(CO.t<=3 && CO.phase!=="work") beep(0);
    coachPaint();
  }, 1000);
}

/* 짧은 비프 — 카운트다운 체감용 (오디오 파일 없이 WebAudio) */
function beep(kind){
  try{
    const ac = window._ac || (window._ac = new (window.AudioContext||window.webkitAudioContext)());
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = kind===2 ? 880 : kind===1 ? 660 : 440;
    g.gain.value = 0.07;
    o.start(); o.stop(ac.currentTime + (kind===2?0.28:0.1));
  }catch(e){}
}

/* [끝] — 세트 완료 → 휴식 or 다음 운동 */
function coachDone(){
  const e = coachEx(), st = coachSet();
  CO.log[e.id] = CO.log[e.id] || [];
  CO.log[e.id][CO.si] = {w:st.w, reps:st.reps, done:true, sec:CO.t};
  coachSaveDraft();
  const last = CO.si >= coachSets().length-1;
  if(!last){ CO.si++; CO.phase="rest"; CO.t=e.rest||60; }
  else if(CO.ei < CO.plan.exs.length-1){ CO.phase="move"; CO.t=20; }
  else { CO.phase="done"; if(CO.timer) clearInterval(CO.timer); }
  coachRender();
}
/* [이동완료] — 다음 운동으로 */
function coachMoved(){
  CO.ei++; CO.si=0; CO.phase="ready"; CO.t=5; coachRender();
}
/* 세트 체감 — 다음 세트 무게 즉시 조정 */
function coachFeel(dir){
  const e = coachEx();
  adjustFrom(coachSets(), CO.si-1 < 0 ? 0 : CO.si-1, dir, EX[e.id]);
  const nx = coachSets()[CO.si];
  toast(dir==="heavy" ? "다음 세트 "+(nx?nx.w+"kg":"")+"로 낮췄어요 👍"
                      : "다음 세트 "+(nx?nx.w+"kg":"")+"로 올렸어요 💪");
  coachRender();
}
function coachSkipRest(){ CO.t=1; }
function coachAddRest(){ CO.t+=15; coachPaint(); }

function coachSaveDraft(){
  const tk = todayKey();
  P().done[tk] = P().done[tk] || {};
  for(const id in CO.log){
    P().done[tk][id] = {sets: CO.log[id].filter(Boolean),
                        planSets: (CO.plan.exs.find(x=>x.id===id)||{}).planSets || null};
  }
  persist();
}

const mmss = t => Math.floor(t/60)+":"+String(Math.max(0,t%60)).padStart(2,"0");

/* 화면 전체 다시 그리기 */
function coachRender(){
  let v = $("#coachView");
  if(!v){ v = el("div",""); v.id="coachView"; document.body.appendChild(v); }
  if(CO.phase==="done"){ v.innerHTML = coachDoneHTML(); bindDone(v); return; }
  const e = coachEx(), sets = coachSets(), st = coachSet();
  const total = CO.plan.exs.length;
  const warm = st.kind==="warm";
  v.innerHTML = `
   <div class="co-wrap">
    <div class="co-top">
      <button class="co-x" onclick="coachStop()">✕</button>
      <div class="co-prog">${CO.ei+1} / ${total} 운동 · ${CO.si+1} / ${sets.length} 세트</div>
    </div>
    <div class="co-bar"><i style="width:${Math.round(((CO.ei + (CO.si+1)/sets.length)/total)*100)}%"></i></div>

    <div class="co-exname">${CO.ei+1}. ${e.name}</div>
    ${e.br && e.wt!=="free" ? `<div class="co-eq">🏋️ ${e.br}${e.wt==="pin"?" · 핀":e.wt==="plate"?" · 원판":""}${e.no&&e.no!=="—"?" · No."+e.no:""}</div>` : ""}
    <div class="co-machine">${machineArt(e)}</div>
    <button class="co-yt" onclick="openYT('${(e.yt||e.name).replace(/'/g,"")}')">▶ 운동방법 보기</button>

    <div class="co-body" id="coBody">${coachBodyHTML()}</div>
   </div>`;
  coachPaint();
}

/* 상태별 본문 */
function coachBodyHTML(){
  const e = coachEx(), st = coachSet(), sets = coachSets();
  const warm = st.kind==="warm";
  if(CO.phase==="ready"){
    return `<div class="co-phase">${warm?"🔥 워밍업":"💪 "+(st.label||"세트")} 준비</div>
      <div class="co-target"><b>${st.w!=null?st.w+"<small>kg</small>":"맨몸"}</b> × <b>${st.reps}<small>회</small></b></div>
      <div class="co-count" id="coT">5</div>
      <div class="co-sub">곧 시작합니다!</div>
      <button class="co-btn ghost" onclick="CO.t=1">바로 시작 ▶</button>`;
  }
  if(CO.phase==="work"){
    return `<div class="co-phase go">${warm?"🔥 워밍업":"💪 "+(st.label||"세트")} 진행 중</div>
      <div class="co-target"><b>${st.w!=null?st.w+"<small>kg</small>":"맨몸"}</b> × <b>${st.reps}<small>회</small></b></div>
      <div class="co-count sm" id="coT">0:00</div>
      <div class="co-sub">${st.reps}회 끝나면 아래 버튼을 눌러주세요</div>
      <button class="co-btn big" onclick="coachDone()">세트 완료 ✓</button>`;
  }
  if(CO.phase==="rest"){
    const nx = sets[CO.si];
    return `<div class="co-phase rest">😮‍💨 휴식</div>
      <div class="co-count" id="coT">${mmss(CO.t)}</div>
      <div class="co-next">다음 · <b>${nx.w!=null?nx.w+"kg":"맨몸"} × ${nx.reps}회</b></div>
      <div class="co-feel">
        <span>방금 세트 어땠어요?</span>
        <button onclick="coachFeel('heavy')">😤 무거웠다</button>
        <button onclick="coachFeel('light')">🙂 가벼웠다</button>
      </div>
      <div class="co-row">
        <button class="co-btn ghost" onclick="coachAddRest()">+15초</button>
        <button class="co-btn" onclick="coachSkipRest()">건너뛰기 ▶</button>
      </div>`;
  }
  if(CO.phase==="move"){
    const nx = CO.plan.exs[CO.ei+1];
    return `<div class="co-phase move">🚶 다음 운동으로 이동</div>
      <div class="co-movename">${nx.name}</div>
      ${nx.br && nx.wt!=="free" ? `<div class="co-eq">🏋️ ${nx.br}${nx.wt==="pin"?" · 핀":nx.wt==="plate"?" · 원판":""}${nx.no&&nx.no!=="—"?" · No."+nx.no:""}</div>`:""}
      <div class="co-count sm" id="coT">${mmss(CO.t)}</div>
      <div class="co-sub">기구로 이동하세요</div>
      <button class="co-btn big" onclick="coachMoved()">이동 완료 ✓</button>`;
  }
  return "";
}

function coachDoneHTML(){
  let sets=0, vol=0;
  for(const id in CO.log) CO.log[id].filter(Boolean).forEach(s=>{ sets++; vol += (s.w||0)*(s.reps||0); });
  return `<div class="co-wrap done">
    <div class="co-fin">🎉</div>
    <div class="co-exname">오늘 운동 완료!</div>
    <div class="co-sum">${CO.plan.exs.length}종목 · ${sets}세트 · 총 ${Math.round(vol).toLocaleString()}kg</div>
    <div class="co-sub" style="margin:14px 0 18px">이어서 유산소 15분 하면 오늘 50분 완성이에요 🏃</div>
    <button class="co-btn big" id="coFin">기록 저장하고 끝내기</button>
    <button class="co-btn ghost" onclick="coachStop()">닫기</button>
  </div>`;
}
function bindDone(v){
  const b = v.querySelector("#coFin");
  if(b) b.onclick = ()=>{ coachSaveDraft(); coachStop(); finishWorkout(); };
}

/* 숫자만 매초 갱신 (전체 리렌더 없이) */
function coachPaint(){
  const t = $("#coT"); if(!t) return;
  if(CO.phase==="ready") t.textContent = CO.t;
  else if(CO.phase==="work") t.textContent = mmss(CO.t);
  else t.textContent = mmss(CO.t);
}

/* 기구 일러스트 — 운동 종류별 픽토그램 (8/4 대표)
   실제 사진이 없으므로 SVG로 그린다. 종목 id·이름으로 형태를 고른다. */
function machineArt(e){
  const C="#7cc4ff", G="#22d3a7", D="rgba(124,196,255,.28)";
  const svg = inner => '<svg viewBox="0 0 140 100" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';
  const nm = (e.name||"") + " " + (e.id||"");
  const seat = (x,y) => '<rect x="'+x+'" y="'+y+'" width="34" height="7" rx="3" fill="'+D+'"/>'+
                        '<rect x="'+(x+12)+'" y="'+(y+7)+'" width="10" height="14" rx="3" fill="'+D+'"/>';

/* ═══ PWA (8/4 대표) ═══ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW 등록 실패', e));
  });
}

/* 운동 중 화면 꺼짐 방지 — 코치 모드에서 특히 필요 */
let _wake = null;
async function keepAwake(on){
  try{
    if(on){ if(!_wake && 'wakeLock' in navigator) _wake = await navigator.wakeLock.request('screen'); }
    else if(_wake){ await _wake.release(); _wake = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && typeof CO!=='undefined' && CO) keepAwake(true);
});

/* 홈화면 설치 안내 — 아직 설치 안 했으면 한 번만 띄운다 */
let _installEvt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault(); _installEvt = e;
  if(localStorage.getItem('soldpt_install_dismissed')) return;
  const bar = document.createElement('div');
  bar.id = 'installBar';
  bar.innerHTML = '<span>📲 홈 화면에 추가하면 앱처럼 쓸 수 있어요</span>'+
    '<button id="instYes">설치</button><button id="instNo">나중에</button>';
  document.body.appendChild(bar);
  bar.querySelector('#instYes').onclick = async ()=>{
    bar.remove(); if(_installEvt){ _installEvt.prompt(); _installEvt = null; }
  };
  bar.querySelector('#instNo').onclick = ()=>{
    bar.remove(); localStorage.setItem('soldpt_install_dismissed','1');
  };
});

/* ═══ 계정 전환 (8/4 대표) ═══ */
function switchAccount(){
  const wrap = document.createElement('div');
  wrap.id = 'acctSheet';
  const rows = Object.keys(S.profiles).map(k=>{
    const p = S.profiles[k];
    const on = k === S.current;
    return '<button class="acct-row'+(on?' on':'')+'" data-k="'+k+'">'+
      '<span class="acct-av">'+(p.name[0]||'나')+'</span>'+
      '<span class="acct-info"><b>'+p.name+'</b><small>'+p.goal+' · 운동 '+(p.logdays||[]).length+'회</small></span>'+
      (on?'<span class="acct-now">사용중</span>':'<span class="acct-go">→</span>')+
      '</button>';
  }).join('');
  wrap.innerHTML = '<div class="acct-bg"></div><div class="acct-box">'+
    '<div class="acct-t">계정 선택</div>'+ rows +
    '<button class="acct-add" id="acctAdd">＋ 새 프로필 추가</button>'+
    '<button class="acct-add" id="acctRename">✏️ 지금 계정 이름 바꾸기</button>'+
    '<button class="acct-close" id="acctClose">닫기</button></div>';
  document.body.appendChild(wrap);
  const close = ()=> wrap.remove();
  wrap.querySelector('.acct-bg').onclick = close;
  wrap.querySelector('#acctClose').onclick = close;
  wrap.querySelectorAll('.acct-row').forEach(b=>{
    b.onclick = ()=>{ S.current = b.dataset.k; persist(); close(); boot(); toast(P().name+'님으로 전환했어요'); };
  });
  wrap.querySelector('#acctAdd').onclick = ()=>{
    const nm = prompt('새 프로필 이름을 입력하세요');
    if(!nm || !nm.trim()) return;
    const key = 'u' + Date.now();
    S.profiles[key] = {name:nm.trim(), goal:'근비대', exp:'초급',
      equip:[...DEFAULT_EQUIP], history:{}, logdays:[], readiness:{}, done:{}};
    S.current = key; persist(); close(); boot(); toast(nm.trim()+'님 프로필을 만들었어요');
  };
  wrap.querySelector('#acctRename').onclick = ()=>{
    const nm = prompt('이름을 바꿀까요?', P().name);
    if(!nm || !nm.trim()) return;
    P().name = nm.trim(); persist(); close(); boot(); toast('이름을 바꿨어요');
  };
}
